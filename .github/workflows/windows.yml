name: Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run win:build
      - uses: actions/upload-artifact@v4
        with:
          name: aqilli-studio-windows
          path: release/Aqilli-Studio-*.exe
